name: Build and publish to Docker Hub

on:
  push:
    branches:
      - actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'PA733/grafana'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      IMAGE: docker.io/pa733/grafana:${{ github.sha }}
    steps:
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Add the DOCKERHUB_TOKEN repository secret with write access to pa733/grafana.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Read source timestamp
        id: source
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Prepare runner disk and swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          swap_file="$RUNNER_TEMP/grafana.swap"
          sudo fallocate -l 8G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          df -h /
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: pa733
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          target: final-alpine
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=grafana-amd64
          cache-to: type=gha,scope=grafana-amd64,mode=max,ignore-error=true

      - name: Summarize published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf 'Image: `%s`\n\n' "$IMAGE"
            printf 'Digest: `%s`\n\n' "$DIGEST"
            printf 'Pull: `docker pull %s`\n' "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"
